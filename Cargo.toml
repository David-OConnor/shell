[package]
name = "shell"
version = "0.1.0"
edition = "2024"

# Keep the vendored (patched) rustyline out of this package's workspace.
[workspace]
exclude = ["vendor"]

# Vendored copy of rustyline 18.0.0 with one local patch (src/tty/windows.rs):
# the Windows console reports no character for Ctrl+digit, and upstream drops
# those key events, so Ctrl+1..Ctrl+4 could never reach our bindings. The
# patch recovers the digit from the virtual key code. Windows-only: Unix
# terminals cannot transmit Ctrl+digit at all.
[patch.crates-io]
rustyline = { path = "vendor/rustyline" }

[dependencies]
chrono = "0.4.44"

# Hmm. What's this for?
rustyline = "18.0.0"
crossterm = "0.29.0"

# For use with ssh.
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "linux-native"] }
# Default features pull `aws-lc-rs`, whose `aws-lc-sys` build needs NASM + a C
# toolchain on Windows. Use the pure-Rust-ish `ring` crypto backend instead
# (vendored asm, no NASM), keeping compression (`flate2`) and RSA key support.
russh = { version = "0.61.2", default-features = false, features = ["ring", "flate2", "rsa"] }
# Required for russh.
tokio = { version = "1.52.3", features = ["rt", "io-util", "macros", "sync", "rt-multi-thread", "net", "time"] }
